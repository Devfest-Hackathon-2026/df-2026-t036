name: illustration_exchange
description: Illustration Exchange Flutter application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  file_selector: ^1.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  http: ^1.3.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # 標準のMaterialアイコンを有効にする。
  uses-material-design: true
  assets:
    # FirebaseのWeb公開設定を同梱する。Admin SDKの秘密鍵は入れない。
    - firebase-config.local.json
    - assets/images/