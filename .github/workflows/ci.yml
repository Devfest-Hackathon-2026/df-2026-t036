name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PRの古い検証だけを中断し、本番デプロイの途中終了を避ける。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: back/requirements*.txt
      - run: python -m pip install -r back/requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest back/tests -q

  frontend:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flont
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      # CIは実環境のFirebase設定を使わず、公開サンプルで検証する。
      - run: cp firebase-config.example.json firebase-config.local.json
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --platform linux/amd64 -t illustration-exchange-api:${{ github.sha }} ./back
      - run: docker run --rm illustration-exchange-api:${{ github.sha }} python -m pip check
      - name: Verify startup and image isolation
        shell: bash
        run: |
          set -euo pipefail
          image="illustration-exchange-api:${GITHUB_SHA}"
          docker run --rm "$image" python -c "from pathlib import Path; import os; assert not any(Path('/app').rglob('*.env')); assert os.getuid() != 0"
          # 検証用コンテナは成功・失敗にかかわらず削除する。
          container=$(docker run -d --rm -e PORT=9090 "$image")
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container" python -c "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:9090/health', timeout=2)) == {'status': 'ok'}"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      # 本番には検証済みの同じイメージを渡し、再ビルドしない。
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUD_RUN_DEPLOY_ENABLED == 'true'
        run: docker save illustration-exchange-api:${{ github.sha }} -o /tmp/api-image.tar
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUD_RUN_DEPLOY_ENABLED == 'true'
        with:
          name: api-image
          path: /tmp/api-image.tar
          retention-days: 1

  deploy:
    name: Deploy Cloud Run
    needs: [backend, frontend, docker]
    # GCP設定を完了してからリポジトリ変数で自動デプロイを有効にする。
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUD_RUN_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in PROJECT_ID REGION REPOSITORY SERVICE WIF_PROVIDER DEPLOY_ACCOUNT; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing deployment variable: $key"
              exit 1
            fi
          done
      - uses: actions/download-artifact@v4
        with:
          name: api-image
          path: /tmp/api-image
      - run: docker load -i /tmp/api-image/api-image.tar
      # 長期秘密鍵は保存せず、GitHubのOIDCトークンで認証する。
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Push tested image and deploy
        shell: bash
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker tag "illustration-exchange-api:${GITHUB_SHA}" "$image"
          docker push "$image"
          # 既存サービスの環境変数・実行用アカウント・公開設定を維持する。
          gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$image" --port 8080 --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)' >> "$GITHUB_STEP_SUMMARY"