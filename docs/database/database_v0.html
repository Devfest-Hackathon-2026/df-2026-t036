<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>お絵描きマッチング DB構造</title><style>/* 既存の構成図と同様、図全体を一枚で表示する。 */body{margin:0;background:#f7f9fc}svg{display:block;max-width:100%;height:auto}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2300" viewBox="0 0 1600 2300"><rect width="1600" height="2300" fill="#f7f9fc"/><style>text{font-family:Yu Gothic UI,Meiryo,sans-serif;fill:#202936}</style><text x="54" y="65" font-size="30" font-weight="700">DB保存階層 — B案</text><text x="54" y="105" font-size="17">Firestore直下6種類 ＋ ユーザー配下の描いた履歴。スロット・ピンは独立した文書。</text><rect x="54" y="145" width="720" height="520" rx="12" fill="white" stroke="#8db2f4"/><rect x="820" y="145" width="725" height="520" rx="12" fill="white" stroke="#8db2f4"/><text x="80" y="190" font-size="20">Firestore / users / {uid}</text><text x="80" y="234" font-size="20">  ランダムnickname・状態・累計のユーザー文書</text><text x="80" y="278" font-size="20"></text><text x="80" y="322" font-size="20">  └─ drawnHistory / {submissionId}</text><text x="80" y="366" font-size="20">       このユーザーが描いた履歴</text><text x="80" y="410" font-size="20">       作品と同じID・作品消滅後も保持</text><text x="80" y="454" font-size="20"></text><text x="80" y="498" font-size="20">Googleログインで参加・招待制限なし</text><text x="80" y="542" font-size="20">通知・退会・名前変更の機能は作らない</text><text x="80" y="586" font-size="20">履歴は別文書。親への埋め込みではない。</text><text x="845" y="190" font-size="20">Firestore直下の独立コレクション</text><text x="845" y="234" font-size="20">userSlots / {uid}          掲載枠</text><text x="845" y="278" font-size="20">userPins / {uid}           ピン</text><text x="845" y="322" font-size="20">ideas / {ideaId}           全員のお題</text><text x="845" y="366" font-size="20">artworks / {submissionId}  受信作品情報</text><text x="845" y="410" font-size="20">uploadSessions / {uploadId} アップロード管理</text><text x="845" y="454" font-size="20"></text><text x="845" y="498" font-size="20">Cloud Storage：一時画像・正規化画像のみ</text><text x="845" y="542" font-size="20">HEIC対応・タグ・累計・履歴画面を維持する。</text><text x="54" y="715" font-size="18">データ操作はFastAPIへ集約。メンテナンス中は通常APIを503で停止。認証・一時画像の書込経路は別管理。</text><svg y="760" xmlns="http://www.w3.org/2000/svg" width="1600" height="1540" viewBox="0 0 1600 1540" role="img" aria-labelledby="title desc">
<title id="title">お絵描きマッチング — DB構造</title>
<desc id="desc">Firestoreの主要7種類のデータとStorage、採用した簡略構成の関係図。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e7ed"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2865ce"/></marker></defs>
<style>text{font-family:'Yu Gothic UI','Meiryo',sans-serif;fill:#202936}.heading{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#6d7c90}.name{font-size:22px;font-weight:700}.path{font-family:Consolas,monospace;font-size:13px;fill:#2865ce}.field{font-size:17px}.small{font-size:15px;fill:#627083}.edge{fill:none;stroke:#2865ce;stroke-width:1.8;marker-end:url(#arrow)}.label{font-size:15px;fill:#375479;paint-order:stroke;stroke:#f7f9fc;stroke-width:7px;stroke-linejoin:round}</style>
<rect width="1600" height="1540" fill="#f7f9fc"/><rect width="1600" height="1540" fill="url(#grid)"/>
<text x="54" y="65" class="heading">DB参照関係 — 線はIDのつながり</text>
<text x="54" y="100" class="sub">M0–M1 DB・API仕様書 v0.9・ハッカソン版・API集約 ／ 採用済み7種類のデータ・送信と保存の関係</text>
<path d="M400 260 H600" class="edge"/><text x="435" y="246" class="label">ownerId</text><path d="M230 180 V138 H1320 V180" class="edge"/><text x="700" y="130" class="label">artistId：描き手 ／ recipientId：受信者</text><path d="M60 380 H28 V750 H60" class="edge"/><text x="42" y="475" class="label">同じUID</text><path d="M28 750 V955 H60" class="edge"/><text x="42" y="865" class="label">同じUID</text><path d="M400 750 H500 V360 H600" class="edge"/><text x="423" y="730" class="label">ideaId</text><path d="M400 955 H540 V400 H600" class="edge"/><text x="421" y="975" class="label">pinnedIdeaIds</text><path d="M960 300 H1130" class="edge"/><text x="987" y="282" class="label">sourceIdeaId</text><path d="M1335 650 V470" class="edge"/><text x="1352" y="563" class="label">同じsubmissionId</text><path d="M1130 760 H1020 V390 H960" class="edge"/><text x="985" y="590" class="label">ideaId</text><path d="M1335 470 V520 H1568 V1060 H1540" class="edge"/><text x="1383" y="980" class="label">storagePath</text><path d="M780 650 V440" class="edge"/><text x="800" y="550" class="label">ideaId：送信先</text><path d="M960 760 H1080 V370 H1130" class="edge"/><text x="973" y="630" class="label">submissionId：確定先</text><rect x="60" y="180" width="340" height="250" rx="12" fill="#ffffff" stroke="#8db2f4"/><text x="80" y="213" class="name">ユーザー状態・累計</text><text x="80" y="243" class="path">users/{uid}</text><text x="80" y="276" class="field">nickname：初回ランダム / status</text><text x="80" y="303" class="field">ideaCount / drawnCount</text><text x="80" y="330" class="field">likesReceived</text><text x="80" y="357" class="field">createdAt</text><text x="80" y="410" class="small">文書ID＝Firebase Auth UID</text><rect x="60" y="500" width="340" height="125" rx="12" fill="#ffffff" stroke="#8db2f4"/><text x="80" y="533" class="name">アクセス窓口</text><text x="80" y="563" class="path">Flutter → FastAPI</text><text x="80" y="596" class="field">Firestoreは直接読み書きしない</text><rect x="60" y="680" width="340" height="150" rx="12" fill="#ffffff" stroke="#8db2f4"/><text x="80" y="713" class="name">掲載スロット</text><text x="80" y="743" class="path">userSlots/{uid}</text><text x="80" y="776" class="field">maxSlots：5</text><text x="80" y="803" class="field">slots：ideaId・expiresAt またはnull</text><rect x="60" y="890" width="340" height="150" rx="12" fill="#ffffff" stroke="#8db2f4"/><text x="80" y="923" class="name">ピン</text><text x="80" y="953" class="path">userPins/{uid}</text><text x="80" y="986" class="field">maxPins：5</text><text x="80" y="1013" class="field">pinnedIdeaIds：お題ID配列</text><rect x="600" y="180" width="360" height="260" rx="12" fill="#ffffff" stroke="#8db2f4"/><text x="620" y="213" class="name">お題</text><text x="620" y="243" class="path">ideas/{ideaId}</text><text x="620" y="276" class="field">ownerId / title / description / tags</text><text x="620" y="303" class="field">createdAt / publishedUntil</text><text x="620" y="330" class="field">acceptUntil / deletedAt</text><text x="620" y="420" class="small">7日でTL終了・30日で受付終了／本体保持</text><rect x="1130" y="180" width="410" height="290" rx="12" fill="#ffffff" stroke="#8db2f4"/><text x="1150" y="213" class="name">受信作品</text><text x="1150" y="243" class="path">artworks/{submissionId}</text><text x="1150" y="276" class="field">artistId / recipientId / sourceIdeaId</text><text x="1150" y="303" class="field">sourceIdeaSnapshot</text><text x="1150" y="330" class="field">storagePath：正規化画像1枚</text><text x="1150" y="357" class="field">liked / createdAt / expiresAt</text><text x="1150" y="384" class="field">deletedAt / readAt：初回詳細表示</text><text x="1150" y="450" class="small">送信から7日保持・画像閲覧は受信者のみ</text><rect x="1130" y="650" width="410" height="215" rx="12" fill="#ffffff" stroke="#8db2f4"/><text x="1150" y="683" class="name">描いた履歴</text><text x="1150" y="713" class="path">users/{uid}/drawnHistory/{submissionId}</text><text x="1150" y="746" class="field">artistId / ideaId</text><text x="1150" y="773" class="field">submittedAt / lastLiked</text><text x="1150" y="845" class="small">作品消滅後も保持／画像パスは持たない</text><rect x="600" y="650" width="360" height="285" rx="12" fill="#ffffff" stroke="#8db2f4"/><text x="620" y="683" class="name">アップロード管理</text><text x="620" y="713" class="path">uploadSessions/{uploadId}</text><text x="620" y="746" class="field">artistId / ideaId / submissionId</text><text x="620" y="773" class="field">status：pending / committed / expired</text><text x="620" y="800" class="field">tempPath / objectGeneration</text><text x="620" y="827" class="field">createdAt / expiresAt / committedAt</text><text x="620" y="915" class="small">有効期間は暫定30分・FastAPIで管理</text><rect x="600" y="1000" width="360" height="215" rx="12" fill="#ffffff" stroke="#8db2f4"/><text x="620" y="1033" class="name">受信箱の自動更新</text><text x="620" y="1063" class="path">Flutter → inbox API</text><text x="620" y="1096" class="field">前面表示中のみ定期取得（3分（180秒））</text><text x="620" y="1123" class="field">背景・離脱で停止、復帰時に再取得</text><text x="620" y="1150" class="field">先頭更新成功時、後続ページは破棄</text><text x="620" y="1195" class="small">一覧では未読維持・詳細表示後に既読</text><rect x="1130" y="1000" width="410" height="125" rx="12" fill="#ffffff" stroke="#8db2f4"/><text x="1150" y="1033" class="name">非公開の画像実体</text><text x="1150" y="1063" class="path">Cloud Storage</text><text x="1150" y="1096" class="field">正規化画像：表示・保存に共用</text><text x="60" y="1120" class="name">IDと参照のルール</text><text x="60" y="1155" class="field">uid：Firebase AuthのUID</text><text x="60" y="1185" class="field">ideaId：UUID v4・再送も同じID</text><text x="60" y="1215" class="field">uploadId：FastAPIでランダム生成</text><text x="60" y="1245" class="field">submissionId：描き手×お題で一意</text><text x="60" y="1275" class="small">SHA-256による生成方式は実装案</text><text x="600" y="1280" class="name">送信：prepare → 一時画像 → commit</text><text x="600" y="1315" class="small">同じuploadIdの検証済み完成画像を再利用して確定</text><text x="1130" y="1180" class="name">削除・再試行</text><text x="1130" y="1215" class="field">deletedAt・expiresAtを確認</text><text x="1130" y="1245" class="field">画像を先に削除、DB文書を最後に削除</text><text x="1130" y="1275" class="small">jobs・idempotencyKeysは作らない</text><text x="54" y="1430" class="small">線の意味：IDによる論理参照。外部キー制約・JOIN・親子の格納階層を表すものではありません。</text><text x="54" y="1460" class="small">履歴は参照先が削除されても残ります。artistId・recipientIdによるユーザー参照は、一部の線を省略しています。</text><text x="54" y="1490" class="small">採用構成の設計図です。SHA-256・30分等の詳細案は別途確定します。実装完了を示す図ではありません。更新日：2026-11-05</text></svg></svg></body></html>
